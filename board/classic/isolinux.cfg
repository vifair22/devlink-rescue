# The devlink-rescue classic image from CD. The agent is on COM1 in both; the
# second entry also puts the kernel console on COM2.
UI menu.c32
MENU TITLE devlink-rescue
DEFAULT rescue
TIMEOUT 50

LABEL rescue
  MENU LABEL DevLink recovery
  KERNEL /isolinux/bzimage
  INITRD /isolinux/initrd.xz

LABEL serial
  MENU LABEL DevLink recovery (serial debug)
  KERNEL /isolinux/bzimage
  INITRD /isolinux/initrd.xz
  APPEND console=ttyS1,115200
